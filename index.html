<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <style>
        .chat-container { height: 65vh; overflow-y: auto; scroll-behavior: smooth; }
        .user-msg { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #f3f4f6; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
        #calendar { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .dot { height: 8px; width: 8px; background: #ef4444; border-radius: 50%; margin: 2px auto; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div class="flex h-screen flex-col md:flex-row">
        <div class="w-full md:w-1/2 p-4 lg:p-8 border-r bg-white">
            <div class="mb-6">
                <h1 class="text-3xl font-extrabold text-slate-800">My Tasks 📅</h1>
                <p class="text-slate-500">Visual schedule of your AI-managed events.</p>
            </div>
            <div id="calendar"></div>
        </div>

        <div class="w-full md:w-1/2 flex flex-col p-4 lg:p-8">
            <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
                <div class="p-4 border-b bg-slate-50 flex items-center gap-3">
                    <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="font-semibold">AI Assistant</span>
                </div>

                <div id="chatWindow" class="chat-container flex flex-col gap-4 p-6">
                    <div class="bot-msg p-4 rounded-2xl max-w-[80%] shadow-sm">
                        Hello! I'm your AI task manager. Tell me what's on your mind! 🚀
                    </div>
                </div>

                <div id="loader" class="hidden px-6 py-2 flex items-center gap-2 text-slate-400 text-sm italic">
                    <svg class="animate-spin h-4 w-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Agent is processing...
                </div>

                <div class="p-4 border-t bg-slate-50">
                    <div class="flex gap-2 bg-white p-2 rounded-xl border border-slate-200 focus-within:ring-2 focus-within:ring-blue-500 transition-all">
                        <input id="userInput" type="text" class="flex-1 p-2 outline-none" placeholder="Add a task, delete something, or ask for your schedule...">
                        <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                            Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let calendar;

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
                height: 'auto'
            });
            calendar.render();
            refreshTasks();
        });

        async function refreshTasks() {
            try {
                const res = await fetch('/tasks');
                const tasks = await res.json();
                const events = tasks.map(t => ({
                    title: t.title,
                    start: t.start_date,
                    color: t.status === 'Completed' ? '#10b981' : '#3b82f6'
                }));
                calendar.removeAllEvents();
                calendar.addEventSource(events);
            } catch (e) { console.error("Update failed", e); }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatWindow = document.getElementById('chatWindow');
            const loader = document.getElementById('loader');
            const text = input.value.trim();

            if (!text) return;

            // Show User Message
            chatWindow.innerHTML += `<div class="user-msg p-4 rounded-2xl max-w-[80%] shadow-sm">${text}</div>`;
            input.value = '';
            
            // Show Loader & Scroll
            loader.classList.remove('hidden');
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();

                // Show Bot Response
                chatWindow.innerHTML += `<div class="bot-msg p-4 rounded-2xl max-w-[80%] shadow-sm">${data.reply}</div>`;
            } catch (err) {
                chatWindow.innerHTML += `<div class="bot-msg p-4 rounded-2xl bg-red-50 text-red-600">Failed to connect to AI Agent.</div>`;
            } finally {
                loader.classList.add('hidden');
                chatWindow.scrollTop = chatWindow.scrollHeight;
                refreshTasks();
            }
        }
    </script>
</body>
</html>
