<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <style>
        .chat-container { height: 60vh; overflow-y: auto; scroll-behavior: smooth; }
        .user-bubble { background: #2563eb; color: white; align-self: flex-end; border-radius: 18px 18px 2px 18px; }
        .bot-bubble { background: #f3f4f6; color: #1f2937; align-self: flex-start; border-radius: 18px 18px 18px 2px; }
        #calendar { background: white; padding: 1rem; border-radius: 1rem; border: 1px solid #e2e8f0; }
        .fc-event { cursor: pointer; border: none !important; padding: 2px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div class="max-w-7xl mx-auto flex flex-col md:flex-row h-screen p-4 gap-6">
        
        <div class="w-full md:w-1/2 flex flex-col gap-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h1 class="text-2xl font-bold text-gray-800 mb-1">Task Calendar 📅</h1>
                <p class="text-sm text-gray-500 mb-4">View and manage your AI-synced schedule.</p>
                <div id="calendar"></div>
            </div>
        </div>

        <div class="w-full md:w-1/2 flex flex-col">
            <div class="flex-1 bg-white rounded-2xl shadow-lg border border-gray-200 flex flex-col overflow-hidden">
                <div class="p-4 border-b bg-gray-50 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></span>
                        <span class="font-bold text-gray-700">AI Assistant</span>
                    </div>
                </div>

                <div id="chatFeed" class="chat-container flex flex-col gap-4 p-6">
                    <div class="bot-bubble p-4 max-w-[85%] shadow-sm">
                        Welcome! I'm ready to help. You can say things like "Add a meeting tomorrow at 10 AM" or "Show my tasks".
                    </div>
                </div>

                <div id="statusIndicator" class="hidden px-6 py-2 flex items-center gap-2 text-blue-500 text-xs font-medium uppercase tracking-wider">
                    <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    AI is processing...
                </div>

                <div class="p-4 bg-gray-50 border-t">
                    <div class="flex gap-2 bg-white p-2 rounded-xl border border-gray-300 focus-within:border-blue-500 transition-all">
                        <input id="chatInput" type="text" class="flex-1 px-3 outline-none" placeholder="Message your agent...">
                        <button onclick="handleSendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg transition-all font-semibold">
                            Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let calendar;

        document.addEventListener('DOMContentLoaded', () => {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
                eventDisplay: 'block'
            });
            calendar.render();
            syncTasks();
        });

        async function syncTasks() {
            try {
                const response = await fetch('/tasks');
                const taskList = await response.json();
                
                // Mapping the data to FullCalendar events
                // Note: using 't.date' to match the new todo_service.py
                const events = taskList.map(t => ({
                    id: t.id,
                    title: t.title,
                    start: t.date, 
                    backgroundColor: t.status === 'completed' ? '#10b981' : '#3b82f6'
                }));
                
                calendar.removeAllEvents();
                calendar.addEventSource(events);
            } catch (err) {
                console.error("Sync Error:", err);
            }
        }

        async function handleSendMessage() {
            const inputField = document.getElementById('chatInput');
            const feed = document.getElementById('chatFeed');
            const status = document.getElementById('statusIndicator');
            const query = inputField.value.trim();

            if (!query) return;

            // Display User Message
            feed.innerHTML += `<div class="user-bubble p-4 max-w-[85%] shadow-md mb-2">${query}</div>`;
            inputField.value = '';
            
            // Show Status & Scroll
            status.classList.remove('hidden');
            feed.scrollTop = feed.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query })
                });
                const result = await response.json();

                // Display Agent Response
                feed.innerHTML += `<div class="bot-bubble p-4 max-w-[85%] shadow-sm mb-2">${result.reply}</div>`;
            } catch (e) {
                feed.innerHTML += `<div class="bot-bubble p-4 bg-red-50 text-red-600">Connection error. Please check backend.</div>`;
            } finally {
                status.classList.add('hidden');
                feed.scrollTop = feed.scrollHeight;
                syncTasks(); // Refresh the calendar
            }
        }

        // Enter key support
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
